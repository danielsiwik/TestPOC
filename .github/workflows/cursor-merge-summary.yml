name: Cursor Merge Summary

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/cursor-merge-summary.yml'
      - 'AGENTS.md'
      - '.cursor/skills/**'

permissions:
  contents: read

jobs:
  summarize-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Prepare diff context
        id: diff
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"

          if [ -n "$BEFORE" ]; then
            git diff --name-only "$BEFORE" "$AFTER" -- . \
              ':(exclude).github/workflows/cursor-merge-summary.yml' \
              ':(exclude)AGENTS.md' \
              ':(exclude).cursor/skills/sfdc-business-docs/SKILL.md' > changed_files.txt || true

            git diff --stat "$BEFORE" "$AFTER" -- . \
              ':(exclude).github/workflows/cursor-merge-summary.yml' \
              ':(exclude)AGENTS.md' \
              ':(exclude).cursor/skills/sfdc-business-docs/SKILL.md' > diff_stat.txt || true

            git diff --unified=0 "$BEFORE" "$AFTER" -- . \
              ':(exclude).github/workflows/cursor-merge-summary.yml' \
              ':(exclude)AGENTS.md' \
              ':(exclude).cursor/skills/sfdc-business-docs/SKILL.md' > diff.patch || true
          else
            git ls-files > changed_files.txt || true
            echo "Initial/manual run - no compare base available." > diff_stat.txt
            git show --stat --oneline "${AFTER}" > diff.patch || true
          fi

          if [ -s changed_files.txt ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate fallback business note
        if: steps.diff.outputs.has_changes != 'true'
        shell: bash
        run: |
          cat > business-doc.md <<'EOF'
          # Business Documentation

          ## Summary
          No business-facing product or process change was detected in this merge.

          ## Business Impact
          The merged changes only affected internal workflow, agent, or skill configuration, so there is nothing new for business teams to act on.

          ## Teams Affected
          No Customer Success, Sales Ops, Revenue Ops, Product, or Business Analyst action is required.

          ## What Happens Now
          No business process, Salesforce user workflow, or customer-facing behavior changed.

          ## Follow-up
          No follow-up is required from business stakeholders.
          EOF

      - name: Generate business documentation with Cursor
        if: steps.diff.outputs.has_changes == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        shell: bash
        run: |
          cat > prompt.txt <<'EOF'
          Read AGENTS.md first and follow it strictly.
          Then read .cursor/skills/sfdc-business-docs/SKILL.md and use it as the primary writing skill for this task.

          Important:
          - This is BUSINESS documentation, not technical documentation.
          - Write for non-technical stakeholders such as Customer Success Managers, Sales Ops, Revenue Ops, Product Managers, and Business Analysts.
          - Use plain English.
          - Focus on business meaning, process impact, operational behavior, and what teams need to know.
          - Do not write code-level implementation details unless they are necessary to explain business impact.
          - Do not generate docs-business/ or multiple files. Return one Markdown document only.
          - Ignore workflow, AGENTS, and skill maintenance changes. Focus on the merged business-relevant repository changes only.
          - If the merge contains no meaningful business-facing change, say that clearly instead of inventing impact.
          - Do not add repository, branch, commit, or compare metadata to the document itself.

          Task:
          Create a business-facing documentation note for the changes introduced by the latest merge to main.

          Required output format:
          # Business Documentation

          ## Summary
          Brief plain-English overview of what changed.

          ## Business Impact
          Explain what changed for business users, teams, or operations.

          ## Teams Affected
          State which teams should care and why.

          ## What Happens Now
          Describe any new or changed process behavior, automation behavior, or operational expectation.

          ## Follow-up
          List any recommended checks, communications, or next actions for business stakeholders.

          Use these inputs:
          - changed_files.txt
          - diff_stat.txt
          - diff.patch
          - AGENTS.md
          - .cursor/skills/sfdc-business-docs/SKILL.md
          - README.md if helpful
          EOF

          PROMPT="$(cat prompt.txt)"
          cursor-agent -p "$PROMPT" --model gpt-5.5-high --trust --force > business-doc.md

      - name: Build Asana note metadata
        id: asana_payload
        shell: bash
        run: |
          TITLE="Business documentation for merge to main - ${GITHUB_SHA::7}"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Create Asana note
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANASEC }}
          NOTE_NAME: ${{ steps.asana_payload.outputs.title }}
          WORKSPACE: "15793206719"
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$ASANA_ACCESS_TOKEN" ]; then
            echo "ASANASEC secret is missing or empty."
            exit 1
          fi

          payload=$(jq -nc \
            --arg ws "$WORKSPACE" \
            --arg name "$NOTE_NAME" \
            '{data:{workspace:$ws,name:$name}}')

          echo "$payload" | jq . > asana-payload.json

          response=$(curl -sS -w "\n%{http_code}" \
            -X POST "https://app.asana.com/api/1.0/notes" \
            -H "Authorization: Bearer ${ASANA_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "$payload")

          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)

          echo "HTTP $status"
          echo "$body" | jq .
          echo "$body" > asana-response.json

          if [ "$status" -ge 400 ]; then
            exit 1
          fi

          gid=$(echo "$body" | jq -r '.data.gid')
          echo "note_gid=$gid" >> "$GITHUB_OUTPUT"
          echo "### Created Asana note" >> "$GITHUB_STEP_SUMMARY"
          echo "- name: \`$NOTE_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- gid: \`$gid\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- url: https://app.asana.com/1/${WORKSPACE}/note/${gid}" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub job summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Cursor business documentation"
            echo
            if [ -n "${{ steps.diff.outputs.before }}" ]; then
              echo "Merge range: \`${{ steps.diff.outputs.before }}..${{ steps.diff.outputs.after }}\`"
              echo
            fi
            if [ -f business-doc.md ]; then
              cat business-doc.md
            else
              echo "No business documentation was generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cursor-business-doc
          path: |
            business-doc.md
            changed_files.txt
            diff_stat.txt
            diff.patch
            prompt.txt
            asana-payload.json
            asana-response.json