name: Cursor Merge Summary

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/cursor-merge-summary.yml'
      - 'AGENTS.md'
      - '.cursor/skills/**'

permissions:
  contents: read

jobs:
  summarize-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Prepare diff context
        id: diff
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"

          git diff --name-only "$BEFORE" "$AFTER" -- . \
            ':(exclude).github/workflows/cursor-merge-summary.yml' \
            ':(exclude)AGENTS.md' \
            ':(exclude).cursor/skills/sfdc-business-docs/SKILL.md' > changed_files.txt || true

          git diff --stat "$BEFORE" "$AFTER" -- . \
            ':(exclude).github/workflows/cursor-merge-summary.yml' \
            ':(exclude)AGENTS.md' \
            ':(exclude).cursor/skills/sfdc-business-docs/SKILL.md' > diff_stat.txt || true

          git diff --unified=0 "$BEFORE" "$AFTER" -- . \
            ':(exclude).github/workflows/cursor-merge-summary.yml' \
            ':(exclude)AGENTS.md' \
            ':(exclude).cursor/skills/sfdc-business-docs/SKILL.md' > diff.patch || true

          if [ -s changed_files.txt ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate fallback business note
        if: steps.diff.outputs.has_changes != 'true'
        shell: bash
        run: |
          cat > business-doc.md <<'EOF'
          # Business Documentation

          ## Summary
          No business-facing product or process change was detected in this merge.

          ## Business Impact
          The merged changes only affected internal workflow, agent, or skill configuration, so there is nothing new for business teams to act on.

          ## Teams Affected
          No Customer Success, Sales Ops, Revenue Ops, Product, or Business Analyst action is required.

          ## Operational Notes
          No business process, Salesforce user workflow, or customer-facing behavior changed.

          ## Follow-up
          No follow-up is required from business stakeholders.
          EOF

      - name: Generate business documentation with Cursor
        if: steps.diff.outputs.has_changes == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        shell: bash
        run: |
          cat > prompt.txt <<'EOF'
          Read AGENTS.md first and follow it strictly.
          Then read .cursor/skills/sfdc-business-docs/SKILL.md and use it as the primary writing skill for this task.

          Important:
          - This is BUSINESS documentation, not technical documentation.
          - Write for non-technical stakeholders such as Customer Success Managers, Sales Ops, Revenue Ops, Product Managers, and Business Analysts.
          - Use plain English.
          - Focus on business meaning, process impact, operational behavior, and what teams need to know.
          - Do not write code-level implementation details unless they are necessary to explain business impact.
          - Do not generate docs-business/ or multiple files. Return one Markdown document only.
          - Ignore workflow, AGENTS, and skill maintenance changes. Focus on the merged business-relevant repository changes only.
          - If the merge contains no meaningful business-facing change, say that clearly instead of inventing impact.

          Task:
          Create a business-facing documentation note for the changes introduced by the latest merge to main.

          Required output format:
          # Business Documentation

          ## Summary
          Brief plain-English overview of what changed.

          ## Business Impact
          Explain what changed for business users, teams, or operations.

          ## Teams Affected
          State which teams should care and why.

          ## What Happens Now
          Describe any new or changed process behavior, automation behavior, or operational expectation.

          ## Follow-up
          List any recommended checks, communications, or next actions for business stakeholders.

          Use these inputs:
          - changed_files.txt
          - diff_stat.txt
          - diff.patch
          - AGENTS.md
          - .cursor/skills/sfdc-business-docs/SKILL.md
          - README.md if helpful
          EOF

          PROMPT="$(cat prompt.txt)"
          cursor-agent -p "$PROMPT" --model gpt-5.5-high --trust --force > business-doc.md

      - name: Build Asana note content
        id: asana_payload
        shell: bash
        run: |
          TITLE="Business documentation for merge to main - ${GITHUB_SHA::7}"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Create Asana note
        env:
          ASANA_PAT: ${{ secrets.ASANASEC }}
          ASANA_NOTES_ENDPOINT: ${{ secrets.ASANA_NOTES_ENDPOINT }}
          ASANA_NOTE_TITLE: ${{ steps.asana_payload.outputs.title }}
        shell: bash
        run: |
          if [ -z "$ASANA_NOTES_ENDPOINT" ]; then
            echo "ASANA_NOTES_ENDPOINT secret is missing or empty."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          import urllib.error
          from html import escape

          repo = "${{ github.repository }}"
          branch = "main"
          commit_sha = "${{ github.sha }}"
          compare_range = "${{ steps.diff.outputs.before }}..${{ steps.diff.outputs.after }}"
          title = os.environ["ASANA_NOTE_TITLE"]
          endpoint = os.environ["ASANA_NOTES_ENDPOINT"]

          if os.path.exists("business-doc.md"):
              with open("business-doc.md", "r", encoding="utf-8") as f:
                  md = f.read()
          else:
              md = "# Business Documentation\n\nNo business documentation was generated."

          def markdown_to_asana_html(md_text):
              lines = md_text.splitlines()
              html = ["<body>"]
              in_ul = False
              in_ol = False

              def close_lists():
                  nonlocal in_ul, in_ol
                  if in_ul:
                      html.append("</ul>")
                      in_ul = False
                  if in_ol:
                      html.append("</ol>")
                      in_ol = False

              for raw in lines:
                  line = raw.rstrip()

                  if not line.strip():
                      close_lists()
                      continue

                  if line.startswith("# "):
                      close_lists()
                      html.append(f"<h1>{escape(line[2:].strip())}</h1>")
                      continue

                  if line.startswith("## "):
                      close_lists()
                      html.append(f"<h2>{escape(line[3:].strip())}</h2>")
                      continue

                  if re.match(r"^\d+\.\s+", line):
                      if in_ul:
                          html.append("</ul>")
                          in_ul = False
                      if not in_ol:
                          html.append("<ol>")
                          in_ol = True
                      item = re.sub(r"^\d+\.\s+", "", line)
                      html.append(f"<li>{escape(item)}</li>")
                      continue

                  if line.startswith("- "):
                      if in_ol:
                          html.append("</ol>")
                          in_ol = False
                      if not in_ul:
                          html.append("<ul>")
                          in_ul = True
                      html.append(f"<li>{escape(line[2:].strip())}</li>")
                      continue

                  close_lists()
                  html.append(f"<p>{escape(line.strip())}</p>")

              close_lists()
              html.append("</body>")
              return "".join(html)

          doc_html = markdown_to_asana_html(md)

          if doc_html.startswith("<body>") and doc_html.endswith("</body>"):
              doc_inner = doc_html[len("<body>"):-len("</body>")]
          else:
              doc_inner = doc_html

          full_html = (
              "<body>"
              f"<strong>{escape(title)}</strong>"
              f"<ul>"
              f"<li>Repository: {escape(repo)}</li>"
              f"<li>Branch: {escape(branch)}</li>"
              f"<li>Commit: {escape(commit_sha)}</li>"
              f"<li>Compare: {escape(compare_range)}</li>"
              f"</ul>"
              f"{doc_inner}"
              "</body>"
          )

          payload = {
              "data": {
                  "name": title,
                  "html_text": full_html
              }
          }

          with open("asana-payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)

          req = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['ASANA_PAT']}",
                  "Content-Type": "application/json",
                  "Accept": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req) as response:
                  body = response.read().decode("utf-8")
                  print(body)
                  with open("asana-response.json", "w", encoding="utf-8") as f:
                      f.write(body)
          except urllib.error.HTTPError as e:
              error_body = e.read().decode("utf-8", errors="replace")
              print(error_body)
              with open("asana-response.json", "w", encoding="utf-8") as f:
                  f.write(error_body)
              raise
          PY

      - name: Publish GitHub job summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Cursor business documentation"
            echo
            echo "Merge range: \`${{ steps.diff.outputs.before }}..${{ steps.diff.outputs.after }}\`"
            echo
            if [ -f business-doc.md ]; then
              cat business-doc.md
            else
              echo "No business documentation was generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cursor-business-doc
          path: |
            business-doc.md
            changed_files.txt
            diff_stat.txt
            diff.patch
            prompt.txt
            asana-payload.json
            asana-response.json